<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>[DEV] Feature-X Branch</title>
    <style>
        body {
            font-family: monospace; /* Monospace font for devs */
            background-color: #fffbe6; /* Yellowish tint to warn user */
            color: #333;
            text-align: center;
            padding: 50px;
            margin-top: 30px; /* Space for ribbon */
        }
        /* WARNING RIBBON */
        .dev-ribbon {
            background-color: #ff9800;
            color: black;
            font-weight: bold;
            position: fixed;
            top: 0; left: 0; width: 100%;
            padding: 5px;
            text-align: center;
        }
        .container {
            border: 2px dashed #ff9800; /* Dashed border for Dev */
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        .btn-danger {
            background-color: red;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
        }
        .debug-info {
            background: #333;
            color: #0f0;
            margin-top: 20px;
            padding: 10px;
            text-align: left;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="dev-ribbon">⚠️ YOU ARE ON A SUB-BRANCH (feature-x)</div>

    <div class="container">
        <h1>[TEST] My App</h1>
        <p>Testing new features. Data here is <b>Temporary</b>.</p>
        
        <button class="btn-danger" onclick="resetDevDB()">🗑️ RESET DEV DATABASE</button>

        <div class="debug-info">
            > ENV: Preview<br>
            > API: dev-api.example.com<br>
            > BRANCH: feature/login-update
        </div>
    </div>

    <script>
        // 4. Extra Logic for Developers
        function resetDevDB() {
            // This logic would destroy the main site, but it's safe here
            const confirmAction = confirm("Are you sure? This wipes the test database.");
            if(confirmAction) alert("Dev Database Wiped!");
        }
        
        console.log("DEBUG MODE: Full logging enabled.");
        console.log("Token: abc-123-xyz"); // Sensitive info visible to devs
    </script>

</body>
</html>
